<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2E">
<title>Gestión de Servicios – Terracop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0D1B2E;--s1:#152336;--s2:#1A2B42;--s3:#213552;--line:#2A4163;
  --cyan:#00AEEF;--txt:#FFFFFF;--mut:#8BAFC8;--dim:#5E7898;
  --ok:#2BD576;--warn:#FFC53D;--bad:#FF5A5F;--info:#4DA3FF;--gray:#6B7F99;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1B2E}}
:root[data-theme="dark"]{--bg:#0D1B2E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0D1B2E;color:#FFFFFF;font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:#FFFFFF}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.cond{font-family:var(--cond)}
.hide{display:none!important}

/* ============ BOTONES / FORM ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:#FFFFFF;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--s3)}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#0D1B2E}
.btn.pri:hover{background:#29BFF5}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#0D1B2E}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.bad.fill{background:var(--bad);color:#FFFFFF}
.btn.wa{background:#1FAF55;border-color:#1FAF55;color:#FFFFFF}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:14px;color:var(--mut);margin:0 0 6px;font-weight:500}
.in{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#0F2036;color:#FFFFFF}
.in:focus{border-color:var(--cyan);outline:none}
textarea.in{min-height:90px;resize:vertical;line-height:1.4}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8BAFC8 50%),linear-gradient(135deg,#8BAFC8 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select.in option{background:#152336;color:#FFFFFF}
.fg{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;background:#0F2036;border:0;color:var(--mut);font-weight:600;cursor:pointer}
.seg button.on-si{background:var(--ok);color:#0D1B2E}
.seg button.on-no{background:var(--gray);color:#FFFFFF}
.err{color:var(--bad);font-size:14px;margin-top:6px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0;cursor:pointer;color:#FFFFFF}
.chk input{width:22px;height:22px;accent-color:var(--ok)}

/* ============ CHIPS ============ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(43,213,118,.12)}
.chip.warn{color:var(--warn);background:rgba(255,197,61,.12)}
.chip.bad{color:var(--bad);background:rgba(255,90,95,.12)}
.chip.info{color:var(--info);background:rgba(77,163,255,.12)}
.chip.gray{color:var(--mut);background:rgba(139,175,200,.1)}
.chip.plain::before{display:none}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--s3);color:var(--mut);font-weight:600}

/* ============ LOGIN ============ */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 18px;background:radial-gradient(1200px 600px at 50% -10%,#1A2B42 0%,#0D1B2E 60%)}
.lcard{width:100%;max-width:400px}
.logo{display:flex;align-items:center}
.logo svg{display:block;width:100%;height:auto}
.logo b{display:block;font:700 22px/1 var(--cond);letter-spacing:.02em;color:#0D1B2E}
.logo small{display:block;font-size:12px;color:#3A5575;font-weight:600;margin-top:3px}
.lcard .logo{margin:0 auto 30px;width:200px}
.lcard h1{font:700 34px/1.05 var(--cond);margin:0 0 4px;color:#FFFFFF}
.lcard p.sub{margin:0 0 24px;color:var(--mut)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 10px;background:transparent;border:0;color:var(--mut);cursor:pointer;font-size:14px}
.lerr{background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.4);color:#FFFFFF;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:14px}
.demo{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.demo p{font-size:13px;color:var(--mut);margin:0 0 10px}
.demo .row{display:flex;flex-direction:column;gap:8px}
.ubtn{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#152336;color:#FFFFFF;cursor:pointer;text-align:left}
.ubtn:hover{border-color:var(--mut)}
.ubtn b{display:block;font-size:16px;color:#FFFFFF}.ubtn small{display:block;font-size:13px;color:var(--mut)}
.linkbtn{background:none;border:0;color:var(--cyan);cursor:pointer;padding:8px 0;font-size:15px}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(13,27,46,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .logo{flex:none;width:96px;margin-right:4px}
.top .logo b{font-size:16px}
.top .logo small{display:none}
.top .ttl{font:700 20px/1.1 var(--cond);color:#FFFFFF;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;cursor:pointer;color:#FFFFFF;flex:none}
.ibtn svg{width:22px;height:22px}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#FFFFFF;font:700 12px/20px var(--font);text-align:center}
.who{display:none}
.view{padding:16px 14px 110px;max-width:1280px;width:100%;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#152336;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;cursor:pointer;position:relative;min-height:60px}
.bnav button svg{width:24px;height:24px}
.bnav button.on{color:var(--cyan)}
.bnav .badge{top:4px;right:calc(50% - 22px)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:41;height:56px;padding:0 20px 0 16px;border-radius:28px;border:0;background:var(--cyan);color:#0D1B2E;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,174,239,.35);cursor:pointer}
.fab svg{width:24px;height:24px}
@media(min-width:960px){
  .side{display:flex;flex-direction:column;width:264px;flex:none;position:sticky;top:0;height:100vh;background:#152336;border-right:1px solid var(--line);padding:16px 12px}
  .side .logo{margin:8px 12px 26px;width:140px}
  .nav a{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:46px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:600;margin-bottom:2px}
  .nav a svg{width:22px;height:22px}
  .nav a:hover{background:var(--s2);color:#FFFFFF}
  .nav a.on{background:var(--s3);color:#FFFFFF;box-shadow:inset 3px 0 0 var(--cyan)}
  .nav a .n{margin-left:auto;font:700 14px var(--cond);color:var(--mut);background:var(--bg);padding:1px 8px;border-radius:8px}
  .nav a .n.hot{background:var(--warn);color:#0D1B2E}
  .side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .top .logo{display:none}
  .top{padding:12px 24px}
  .top .ttl{font-size:24px}
  .who{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:14px;background:var(--s1);cursor:pointer}
  .bnav,.mbtn{display:none!important}
  .fab{bottom:28px;right:28px}
  .view{padding:24px 24px 100px}
}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 15px var(--cond);color:#0D1B2E;flex:none}
.av svg{width:58%;height:58%}
.av.JT{background:var(--cyan)}.av.SUP{background:var(--warn)}.av.ADM{background:#B69CFF}
.who b{display:block;font-size:14px;color:#FFFFFF;line-height:1.1}
.who small{font-size:12px;color:var(--mut)}

/* ============ DRAWER / MODAL / TOAST ============ */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.7);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#152336;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;padding:24px}}
.sheet h2{font:700 26px/1.1 var(--cond);margin:0 0 4px;color:#FFFFFF}
.sheet .shd{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet .shd>div{flex:1}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.mlist a,.mlist button{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 6px;border:0;border-bottom:1px solid var(--line);background:none;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}
.mlist svg{width:22px;height:22px;color:var(--mut)}
.mlist .n{margin-left:auto;color:var(--mut);font:700 16px var(--cond)}
#avisos{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;width:min(94vw,420px);pointer-events:none}
.aviso{pointer-events:auto;background:#FFFFFF;color:#0D1B2E;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);padding:12px 8px 12px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border-left:5px solid #00AEEF;animation:drop .25s ease-out}
.aviso.ok{border-left-color:#2BD576}.aviso.warn{border-left-color:#FFC53D}.aviso.bad{border-left-color:#FF5A5F}.aviso.info{border-left-color:#4DA3FF}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.aviso .ai{width:34px;height:34px;border-radius:10px;background:#E6F6FD;color:#0077B6;display:grid;place-items:center}
.aviso .ai svg{width:20px;height:20px}
.aviso b{display:block;font-size:15px;color:#0D1B2E}
.aviso p{margin:2px 0 8px;font-size:14px;line-height:1.35;color:#33475E;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.aviso .ab button{min-height:36px;padding:0 14px;border-radius:9px;border:0;background:#0D1B2E;color:#FFFFFF;font-weight:600;cursor:pointer}
.aviso .x{background:none;border:0;color:#5E7898;cursor:pointer;width:34px;height:34px;display:grid;place-items:center}
.aviso .x svg{width:18px;height:18px}
@media(min-width:960px){#avisos{left:auto;right:24px;transform:none;top:84px}}
@media (prefers-reduced-motion:reduce){.aviso{animation:none}}
.busy{position:fixed;inset:0;z-index:99;background:rgba(5,12,22,.45);display:grid;place-items:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#00AEEF;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.tst{background:#FFFFFF;color:#0D1B2E;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s;display:flex;gap:10px;align-items:flex-start}
.tst i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.tst.warn i{background:var(--warn)}.tst.bad i{background:var(--bad)}.tst.info i{background:var(--info)}
@media(min-width:960px){#toast{bottom:28px;left:auto;right:28px;transform:none}}

/* ============ DASHBOARD ============ */
.hero{background:#152336;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;display:grid;gap:14px}
.hero .hi{color:var(--mut);margin:0}
.hero .big{display:flex;align-items:baseline;gap:12px;margin:0}
.hero .big b{font:700 76px/0.85 var(--cond);color:var(--warn)}
.hero .big.zero b{color:var(--ok)}
.hero .big span{font:600 22px/1.1 var(--cond);color:#FFFFFF}
.hero .next{border-top:1px solid var(--line);padding-top:12px}
@media(min-width:960px){.hero{grid-template-columns:auto 1fr;align-items:center;gap:32px;padding:22px 26px}.hero .next{border-top:0;border-left:1px solid var(--line);padding:0 0 0 28px}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{text-align:left;background:#152336;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:#FFFFFF;display:flex;flex-direction:column;gap:6px;min-height:112px;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--mut)}
.kpi .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.kpi .ico svg{width:18px;height:18px}
.kpi b{font:700 38px/1 var(--cond);color:#FFFFFF}
.kpi span{font-size:13.5px;color:var(--mut);font-weight:500;line-height:1.25}
.k-warn .ico{background:rgba(255,197,61,.15);color:var(--warn)}
.k-info .ico{background:rgba(77,163,255,.15);color:var(--info)}
.k-bad .ico{background:rgba(255,90,95,.15);color:var(--bad)}
.k-ok .ico{background:rgba(43,213,118,.15);color:var(--ok)}
.k-alert .ico{background:rgba(255,197,61,.15);color:var(--warn)}
.k-alert.hot{border-color:rgba(255,197,61,.55)}
.k-cyan .ico{background:rgba(0,174,239,.15);color:var(--cyan)}
.cols{display:grid;gap:22px}
@media(min-width:1100px){.cols{grid-template-columns:1.35fr 1fr}}
.sec h3{font:700 22px/1.1 var(--cond);margin:0 0 10px;color:#FFFFFF;display:flex;align-items:center;gap:10px}
.sec h3 .n{font-size:18px;color:var(--mut)}

/* ============ LISTAS / TARJETAS ============ */
.phead{margin-bottom:14px}
.phead h2{font:700 30px/1.05 var(--cond);margin:0;color:#FFFFFF}
.phead p{margin:4px 0 0;color:var(--mut)}
.list{display:grid;gap:10px}
@media(min-width:1100px){.list.two{grid-template-columns:1fr 1fr}}
.card{background:#152336;border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;cursor:pointer;color:#FFFFFF;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--mut)}
.card .r1{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card .id{font:700 15px var(--cond);color:var(--cyan);letter-spacing:.02em}
.card .cli{font:700 21px/1.1 var(--cond);color:#FFFFFF;margin:0 0 4px}
.route{display:flex;align-items:center;gap:8px;color:#FFFFFF;font-weight:500;flex-wrap:wrap}
.route svg{width:16px;height:16px;color:var(--mut);flex:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mut);margin-top:6px}
.meta b{color:#FFFFFF;font-weight:600}
.nextbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:#0F2036;display:flex;align-items:center;gap:10px}
.nextbox .d{width:14px;height:14px;border-radius:50%;background:var(--warn);flex:none;animation:pulse 1.8s infinite}
.nextbox .t{flex:1;min-width:0;font-size:14px;color:#FFFFFF}
.nextbox .t small{display:block;color:var(--mut)}
.nextbox.me{background:rgba(255,197,61,.1);box-shadow:inset 0 0 0 1px rgba(255,197,61,.4)}
.prog{margin-top:10px}
.prog .bar{height:8px;border-radius:4px;background:#0F2036;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:5px}
.prog .lbl b{color:#FFFFFF}
.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}
.empty b{display:block;color:#FFFFFF;font-size:18px;margin-bottom:4px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.filters .in{min-height:44px;font-size:15px}
.filters .full{grid-column:1/-1}
@media(min-width:900px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.filters .full{grid-column:auto}}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#152336;color:var(--mut);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#FFFFFF;color:#0D1B2E;border-color:#FFFFFF}

/* ============ ALERTAS / NOTIFS ============ */
.al{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#152336;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:12px 14px;cursor:pointer;color:#FFFFFF;text-align:left;width:100%}
.al.late{border-left-color:var(--bad)}
.al .n{font:700 26px/1 var(--cond);color:var(--warn);width:34px;text-align:center}
.al.late .n{color:var(--bad)}
.al .t b{display:block;font-size:16px;color:#FFFFFF}
.al .t small{display:block;color:var(--mut);font-size:13.5px}
.al .age{text-align:right;font-size:13px;color:var(--mut)}
.al .age b{display:block;font:700 18px var(--cond);color:#FFFFFF}
.al.late .age b{color:var(--bad)}
.nt{display:grid;grid-template-columns:auto 1fr;gap:12px;background:#152336;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:#FFFFFF;text-align:left;width:100%}
.nt.unread{border-color:rgba(0,174,239,.55);background:#172A42}
.nt .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.nt .ic svg{width:20px;height:20px}
.nt .m{font-size:15px;color:#FFFFFF}
.nt .x{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut);margin-top:4px;align-items:center}
.nt .dotu{width:9px;height:9px;border-radius:50%;background:var(--cyan);display:inline-block}

<script>
/* =====================================================================
   GESTIÓN DE SERVICIOS – Grupo Terracop · Prototipo v1.0
   Estructura por capas (en un solo archivo, separable luego):
   1. config/   → roles, etapas, maestros
   2. data/     → Repo (adaptador local; reemplazable por Graph/Excel SharePoint)
   3. domain/   → motor de workflow, permisos, notificaciones, historial
   4. ui/       → componentes y vistas
   ===================================================================== */

/* ---------- 1. CONFIG ---------- */
const ROLES = {JT:'Jefe Transporte', SUP:'Supervisor', ADM:'Administrativo'};
const ETAPAS = [
  {n:1,  nom:'Crear Servicio',                                   resp:['JT','ADM'],       frec:'S', tipo:'crear'},
  {n:2,  nom:'Envío de Cotización',                              resp:['JT'],             frec:'S', tipo:'cotizacion'},
  {n:3,  nom:'Confirmar o Cancelar Servicio',                    resp:['JT'],             frec:'S', tipo:'decision'},
  {n:4,  nom:'Ingreso Servicio a Registro de Viajes',            resp:['ADM'],            frec:'S', tipo:'registro'},
  {n:5,  nom:'Asignar Conductor, Tracto y Semirremolque',        resp:['SUP'],            frec:'S', tipo:'asignar'},
  {n:6,  nom:'Notificar a Conductor',                            resp:['SUP'],            frec:'S', tipo:'wa'},
  {n:7,  nom:'Gestionar Pases',                                  resp:['ADM'],            frec:'A', tipo:'simple'},
  {n:8,  nom:'Gestionar Peajes',                                 resp:['ADM'],            frec:'A', tipo:'hecho'},
  {n:9,  nom:'Gestionar Permisos',                               resp:['ADM'],            frec:'A', tipo:'hecho'},
  {n:10, nom:'Enviar Datos de Contacto de Carga a Conductor',    resp:['SUP','ADM','JT'], frec:'S', tipo:'hecho', nb:true},
  {n:11, nom:'Enviar Datos de Contacto de Descarga a Conductor', resp:['SUP','ADM','JT'], frec:'S', tipo:'hecho', nb:true},
  {n:12, nom:'Enviar Datos de Contacto de Conductor a Cliente',  resp:['SUP'],            frec:'S', tipo:'wa'},
  {n:13, nom:'Envío Pases a Conductor',                          resp:['SUP','ADM','JT'], frec:'S', tipo:'hecho'},
  {n:14, nom:'Equipo Operativo',                                 resp:['SUP'],            frec:'S', tipo:'equipo', eliminada:true},
  {n:15, nom:'Checklist Equipo y F&S',                           resp:['SUP'],            frec:'S', tipo:'checklist'},
  {n:16, nom:'Envío Km Inicio Servicio',                         resp:['SUP'],            frec:'S', tipo:'hecho'},
  {n:17, nom:'Envío guía Carga o Descarga',                      resp:['SUP'],            frec:'S', tipo:'hecho'},
  {n:18, nom:'Envío Km carga o Descarga',                        resp:['SUP'],            frec:'S', tipo:'hecho'},
  {n:19, nom:'Envío guía Carga o Descarga',                      resp:['SUP'],            frec:'S', tipo:'hecho'},
  {n:20, nom:'Envío Km Fin de servicio',                         resp:['SUP'],            frec:'S', tipo:'hecho'},
  {n:21, nom:'Cerrar Servicio',                                  resp:['SUP','JT'],       frec:'S', tipo:'fin'}
];
/* nb:true → etapa diferible: puede completarse después y no bloquea las siguientes
   eliminada:true → ya no se usa en servicios nuevos (se mantiene para el historial) */
const CHECKLIST = ['Luces y señalización','Neumáticos y llantas','Frenos y sistema de aire','Documentación del equipo al día','Extintor y kit antiderrame','EPP del conductor','Control de Fatiga y Somnolencia (F&S) aprobado'];
const EST = {NI:{t:'No iniciada',c:'gray'},PEN:{t:'Pendiente',c:'warn'},OK:{t:'Completada',c:'ok'},NA:{t:'No aplica',c:'gray'},CAN:{t:'Cancelada',c:'bad'}};
const SEST = {OPORTUNIDAD:{t:'Esperando confirmación',c:'warn'},ABIERTO:{t:'Abierto',c:'info'},DECLINADO:{t:'Declinado',c:'bad'},CERRADO:{t:'Cerrado',c:'ok'}};

/* ---------- 2. DATA: conexión a Supabase ---------- */
/* La clave publicable es pública por diseño: los datos los protegen las reglas RLS
   y las funciones de la base de datos (script 01). NUNCA poner aquí la clave secreta. */
const CFG = Object.assign({
  url:    'https://vtqwmjuatmfokcgeuaul.supabase.co',
  key:    'sb_publishable_pnaqkzWGvEXIRZ8YZxMXHQ_WI_JT_cW',
  dominio:'terracop.app',     // usuario "supervisor" → supervisor@terracop.app
  dias:   120                 // días de servicios cerrados/declinados que se cargan
}, window.GS_CONFIG || {});
let SB = null;
const vacio = () => ({usuarios:[],clientes:[],origenes:[],destinos:[],tipos:[],conductores:[],tractos:[],semis:[],servicios:[],notifs:[],recientes:[],hist:{}});
let DB = vacio();
const ms = v => v ? Date.parse(v) : null;

function errMsg(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e||'');
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  if(/JWT|token.*expired|not authenticated/i.test(m)) return 'Tu sesión expiró. Vuelve a ingresar.';
  if(e && e.code==='23505') return 'Ya existe un registro con ese nombre.';
  return m || 'Ocurrió un error inesperado.';
}
async function todo(build){   // lee de a 1.000 filas (límite de Supabase)
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await build().range(from,from+999);
    if(error) throw error;
    out.push(...data); if(data.length<1000) break;
  }
  return out;
}
async function rpc(fn,args){ const {data,error}=await SB.rpc(fn,args); if(error) throw error; return data; }

function mapServicio(r){
  return {id:r.id, cliente:String(r.cliente_id), fecha:r.fecha, origen:String(r.origen_id), destino:String(r.destino_id),
    tipo:String(r.tipo_id), carga:r.carga, estado:r.estado, creado:ms(r.creado), creadoPor:r.creado_por,
    asign: r.conductor_id ? {conductor:String(r.conductor_id), tracto:String(r.tracto_id), semi:String(r.semi_id)} : null,
    cancel: r.cancel_fecha ? {motivo:r.cancel_motivo||'', usuario:r.cancel_por, fecha:ms(r.cancel_fecha)} : null,
    cierre: r.cierre_fecha ? {usuario:r.cierre_por, fecha:ms(r.cierre_fecha)} : null,
    etapas:(r.etapas||[]).slice().sort((a,b)=>a.n-b.n).map(e=>({n:e.n, aplica:e.aplica, estado:e.estado,
      desde:ms(e.desde), fecha:ms(e.fecha), usuario:e.usuario, obs:e.obs||'', datos:e.datos||{}}))};
}
const mapHist = h => ({id:h.id, servicio:h.servicio_id, fecha:ms(h.fecha), usuario:h.usuario, accion:h.accion, antes:h.antes||'—', despues:h.despues||'—', etapa:h.etapa, detalle:h.detalle||''});

/* Carga todo lo que la app necesita para trabajar */
async function cargarDatos(){
  const desde = isoLocal(new Date(Date.now()-CFG.dias*DAY));
  const m = t => todo(()=>SB.from(t).select('*').order('id'));
  const conEtapas = '*, etapas(*)';
  const [perfiles,clientes,origenes,destinos,tipos,conductores,tractos,semis,activos,antiguos,notifs,recientes] = await Promise.all([
    todo(()=>SB.from('perfiles').select('*').order('nombre')),
    m('clientes'), m('origenes'), m('destinos'), m('tipos_servicio'), m('conductores'), m('tractos'), m('semirremolques'),
    todo(()=>SB.from('servicios').select(conEtapas).in('estado',['OPORTUNIDAD','ABIERTO']).order('id')),
    todo(()=>SB.from('servicios').select(conEtapas).in('estado',['DECLINADO','CERRADO']).gte('fecha',desde).order('id')),
    SB.from('notificaciones').select('*').order('fecha',{ascending:false}).limit(200).then(r=>{ if(r.error) throw r.error; return r.data; }),
    SB.from('historial').select('*').order('fecha',{ascending:false}).limit(8).then(r=>{ if(r.error) throw r.error; return r.data; })
  ]);
  let leidas = new Set();
  if(notifs.length){
    const minId = Math.min(...notifs.map(n=>n.id));
    const rows = await todo(()=>SB.from('notif_leidas').select('notif_id').eq('usuario',SES).gte('notif_id',minId).order('notif_id'));
    leidas = new Set(rows.map(r=>r.notif_id));
  }
  const S = x => String(x);
  DB = {
    usuarios: perfiles.map(p=>({id:p.id, user:p.usuario, nombre:p.nombre, rol:p.rol, tel:p.telefono||'', activo:p.activo})),
    clientes: clientes.map(c=>({id:S(c.id), nombre:c.nombre, contacto:c.contacto, tel:c.telefono, activo:c.activo})),
    origenes: origenes.map(o=>({id:S(o.id), nombre:o.nombre, activo:o.activo})),
    destinos: destinos.map(o=>({id:S(o.id), nombre:o.nombre, activo:o.activo})),
    tipos: tipos.map(o=>({id:S(o.id), nombre:o.nombre, activo:o.activo})),
    conductores: conductores.map(c=>({id:S(c.id), nombre:c.nombre, rut:c.rut||'', tel:c.telefono, activo:c.activo})),
    tractos: tractos.map(t=>({id:S(t.id), patente:t.patente, marca:t.marca||'', activo:t.activo})),
    semis: semis.map(t=>({id:S(t.id), patente:t.patente, tipo:t.tipo||'', marca:t.marca||'', activo:t.activo})),
    servicios: [...activos,...antiguos].map(mapServicio).sort((a,b)=>b.creado-a.creado),
    notifs: notifs.map(n=>({id:n.id, fecha:ms(n.fecha), tipo:n.tipo, servicio:n.servicio_id, msg:n.mensaje, para:n.para||[],
      leidos: leidas.has(n.id)?[SES]:[], etapaCompletada:n.etapa_completada, etapaNueva:n.etapa_nueva, responsable:n.responsable})),
    recientes: recientes.map(mapHist),
    hist: {}
  };
}
/* Servicio antiguo que no está en memoria (ej. abierto desde una notificación) */
async function cargarServicio(id){
  const {data,error}=await SB.from('servicios').select('*, etapas(*)').eq('id',id).maybeSingle();
  if(error) throw error;
  if(data && !getS(id)) DB.servicios.push(mapServicio(data));
  return !!data;
}
const HIST_CARGANDO = new Set();
async function cargarHistorial(sid){
  const r = await todo(()=>SB.from('historial').select('*').eq('servicio_id',sid).order('fecha',{ascending:false}));
  DB.hist[sid] = r.map(mapHist);
}

/* Pantalla de espera mientras se guarda */
async function ocupado(fn){
  const o=document.createElement('div'); o.className='busy'; o.innerHTML='<div class="spin" role="status" aria-label="Guardando"></div>';
  document.body.appendChild(o);
  try{ return await fn(); } finally{ o.remove(); }
}
/* Ejecuta una acción en la base de datos y recarga */
async function accion(fn){ return ocupado(async()=>{ const r=await fn(); await cargarDatos(); return r; }); }

/* ---------- Tiempo real ---------- */
let CANAL=null, RT_T=null, REFRESCANDO=false;
function conectarTiempoReal(){
  desconectarTiempoReal();
  try{
    CANAL = SB.channel('gs-cambios')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notificaciones'},refrescarPronto)
      .on('postgres_changes',{event:'*',schema:'public',table:'servicios'},refrescarPronto)
      .on('postgres_changes',{event:'*',schema:'public',table:'etapas'},refrescarPronto)
      .subscribe();
  }catch(e){}
}
function desconectarTiempoReal(){ if(CANAL){ try{ SB.removeChannel(CANAL); }catch(e){} CANAL=null; } }
function refrescarPronto(){ clearTimeout(RT_T); RT_T=setTimeout(refrescar,700); }
async function refrescar(){
  if(!SES || REFRESCANDO) return; REFRESCANDO=true;
  try{ await cargarDatos(); if(!me()) return; checkNuevas(); if(puedeRepintar()) render(); }
  catch(e){ /* se reintenta en el próximo ciclo */ }
  finally{ REFRESCANDO=false; }
}
setInterval(()=>{ if(SES && !document.hidden) refrescar(); }, 45000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && SES) refrescar(); });

/* ---------- Exportar a Excel (respaldo y reportes) ---------- */
async function exportarExcel(){
  closeModal();
  if(!window.XLSX){ toast('No se pudo cargar el módulo de Excel. Revisa tu conexión y recarga la página.','bad'); return; }
  try{
    await ocupado(async()=>{
      const [serv,hist] = await Promise.all([
        todo(()=>SB.from('servicios').select('*, etapas(*)').order('id')),
        todo(()=>SB.from('historial').select('*').order('id'))
      ]);
      const S = serv.map(mapServicio);
      const hServ = S.map(s=>{ const p=progreso(s), pe=pendiente(s), x=ctx(s), k0=kmDe(s,16), k1=kmDe(s,20);
        return {'Servicio':s.id,'Estado':SEST[s.estado].t,'Fecha servicio':s.fecha,'Cliente':x.cli.nombre||'','Origen':x.o.nombre||'','Destino':x.d.nombre||'',
          'Tipo':x.tipo||'','Carga':s.carga,'Conductor':x.c.nombre||'','Tracto':x.t.patente||'','Semirremolque':x.sm.patente||'',
          'Avance %':s.estado==='DECLINADO'?'':p.pct,'Etapa pendiente':pe?etq(pe):'','N° registro':(s.etapas[3]&&s.etapas[3].datos.registro)||'',

    case 12: return `*TERRACOP SPA – Servicio ${s.id}*\nEstimado(a) ${x.cli.contacto}, le informamos los datos del conductor asignado para el servicio del ${f} (${x.o.nombre} → ${x.d.nombre}):\n\nConductor: ${x.c.nombre||'—'}\nRUT: ${x.c.rut||'—'}\nTeléfono: ${fTel(x.c.tel)}\nPatente tracto: ${x.t.patente||'—'}\nPatente semirremolque: ${x.sm.patente||'—'}`;

}

function normTel(t){ let d=cleanTel(t); if(d.length===9 && d[0]==='9') d='56'+d; return d; }
function kmDe(s,n){ const v=(s.etapas[n-1].datos||{}).km; return v!=null&&v!==''?Number(v):null; }
function resumenDatos(s,n,d,obs){
  const p=[];
  if(d.resultado==='NR') p.push('No realizada');
  if(d.registro) p.push(`Folio ${d.registro}`);
  if(n===5 && d.conductor) p.push(`${byId('conductores',d.conductor).nombre} · ${byId('tractos',d.tracto).patente} · ${byId('semis',d.semi).patente}`);
  if((n===10||n===11) && d.nombre) p.push(`Contacto ${d.nombre} ${fTel(d.tel)}`);
  if(d.claves) p.push('Claves de pases');
  if(d.detalle) p.push(d.detalle);
  if(d.estadoEquipo) p.push(d.estadoEquipo);
  if(d.checklist){ const m=d.checklist.filter(v=>v==='M').length; p.push(m?`Checklist: ${m} ítem(s) Malo`:'Checklist: todo Bueno'); }
  if(d.km!=null && d.km!=='') p.push(`Km ${Number(d.km).toLocaleString('es-CL')}`);

  if(d.waEnviado) p.push('Enviado por WhatsApp');
  if(obs) p.push(`Obs: ${obs}`);
  return p.join(' · ');
}

  if(!u||!p) return renderLogin('Ingresa usuario y contraseña.', u);
  audioInit();
  const btn=$('#lbtn'); btn.disabled=true; btn.textContent='Ingresando…';
  const email = u.includes('@') ? u : `${u}@${CFG.dominio}`;
  let res;
  try{ res = await SB.auth.signInWithPassword({email, password:p}); }
  catch(e){ return renderLogin(errMsg(e), u); }
  if(res.error){
    const inval=/invalid login|invalid credentials|email not confirmed/i.test(res.error.message||'');
    return renderLogin(inval?'Usuario o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.':errMsg(res.error), u);
  }
  await iniciarSesion(res.data.user.id, true);
}
async function iniciarSesion(uid, alIngresar){

  catch(e){ SES=null; DB=vacio(); try{ await SB.auth.signOut(); }catch(_){} return renderLogin(errMsg(e)); }

  LASTROUTE = location.hash.split('/').slice(0,3).join('/');
  render();
  const ma=misAlertas(me()).length;

    </div>`;
  }
  return `<div class="phead"><h2>${NAV.find(n=>n.k===tipo).t}</h2><p>${cfg[1]}</p></div>${filtros}<div id="lst" class="list two">${listaItems(tipo,data)}</div>`;
}
function listaItems(tipo, data){
  let d=data;
  if(tipo==='abiertos'){
    const q=FILT.q.toLowerCase();
    d=d.filter(s=>{
      const e=pendiente(s);
      if(FILT.cliente && s.cliente!==FILT.cliente) return false;
      if(FILT.fecha && s.fecha!==FILT.fecha) return false;
      if(FILT.resp && !(e && def(e.n).resp.includes(FILT.resp))) return false;
      if(FILT.fase==='prep' && !(e && e.n<=13)) return false;
      if(FILT.fase==='ejec' && !(e && e.n>=14)) return false;
      if(FILT.fase==='late' && !(e && ((Date.now()-(e.desde||s.creado))>DAY || s.fecha<hoyISO()))) return false;
      if(q){ const txt=[s.id,s.carga,byId('origenes',s.origen).nombre,byId('destinos',s.destino).nombre,byId('clientes',s.cliente).nombre].join(' ').toLowerCase(); if(!txt.includes(q)) return false; }
      return true;
    });
  }
  if(tipo==='abiertos'||tipo==='oportunidades') d=d.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!d.length) return emptyHTML(tipo==='abiertos'&&(FILT.q||FILT.cliente||FILT.fase||FILT.resp||FILT.fecha)?'Sin resultados':'No hay servicios aquí',
    tipo==='abiertos'&&(FILT.q||FILT.cliente||FILT.fase||FILT.resp||FILT.fecha)?'Ajusta o limpia los filtros para ver más servicios.':(tipo==='oportunidades'&&puedeCrear(me())?'Crea un servicio con el botón "Nuevo servicio".':''));
  return d.map(s=>cardS(s)).join('');
}

async function leerTodas(){

    });

/* ---------- CARGA DESDE EXCEL (solo Jefe de Transporte) ---------- */
let IMP=null;
const normH = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const normN = s => String(s??'').trim().replace(/\s+/g,' ');
function hojaDe(wb, ...nombres){ const k=wb.SheetNames.find(n=>nombres.includes(normH(n))); return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:'',raw:false}):null; }
function col(row, ...claves){ for(const [k,v] of Object.entries(row)){ if(claves.includes(normH(k))) return normN(v); } return ''; }
function descargarPlantilla(){
  if(!window.XLSX){ toast('No se pudo cargar el módulo de Excel. Recarga la página.','bad'); return; }
  const wb=XLSX.utils.book_new();
  const cl=XLSX.utils.json_to_sheet([{'Cliente':'Ejemplo SpA','Nombre contacto':'Juan Pérez','Teléfono':'+56 9 1234 5678'}]);
  cl['!cols']=[{wch:28},{wch:26},{wch:18}];
  const o=XLSX.utils.json_to_sheet([{'Nombre':'Vallenar'}]); o['!cols']=[{wch:30}];
  const d=XLSX.utils.json_to_sheet([{'Nombre':'Vallenar'}]); d['!cols']=[{wch:30}];
  XLSX.utils.book_append_sheet(wb,cl,'Clientes'); XLSX.utils.book_append_sheet(wb,o,'Origenes'); XLSX.utils.book_append_sheet(wb,d,'Destinos');
  XLSX.writeFile(wb,'Plantilla_Clientes_Origenes_Destinos.xlsx');
}
function importarModal(){
  if(me().rol!=='JT') return;
  IMP=null;
  modal(`<div class="shd"><div><h2>Cargar desde Excel</h2><p class="mut" style="margin:0">Crea o actualiza clientes, orígenes y destinos. Si un nombre ya existe, se actualizan sus datos.</p></div></div>
    <button class="btn block" style="margin-bottom:14px" onclick="descargarPlantilla()">${ic('down')}Descargar plantilla</button>
    <label class="drop" for="impf"><input type="file" id="impf" accept=".xlsx,.xls" onchange="leerExcel(this.files[0])"><b>Seleccionar archivo Excel</b>Hojas: Clientes, Origenes, Destinos</label>
    <div id="impres"></div>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="impbtn" disabled onclick="ejecutarImport()">Cargar datos</button></div>`);
}
function leerExcel(file){
  const res=$('#impres'); IMP=null; $('#impbtn').disabled=true;
  if(!file) return;
  if(!window.XLSX){ res.innerHTML='<div class="banner bad">No se pudo cargar el módulo de Excel. Recarga la página.</div>'; return; }
  const fr=new FileReader();
  fr.onload=()=>{
    let wb; try{ wb=XLSX.read(fr.result,{type:'array'}); }catch(e){ res.innerHTML='<div class="banner bad">No se pudo leer el archivo. Verifica que sea un Excel (.xlsx).</div>'; return; }
    IMP=analizarExcel(wb); res.innerHTML=resumenImport(IMP);
    $('#impbtn').disabled = !(IMP.cli.nuevos.length+IMP.cli.act.length+IMP.ori.nuevos.length+IMP.des.nuevos.length);
  };
  fr.readAsArrayBuffer(file);
}
function analizarExcel(wb){
  const out={cli:{nuevos:[],act:[],igual:0,err:[]}, ori:{nuevos:[],existe:0,err:[]}, des:{nuevos:[],existe:0,err:[]}, hojas:0};
  const rc=hojaDe(wb,'clientes','cliente');
  if(rc){ out.hojas++; const vistos=new Set();
    rc.forEach((r,i)=>{ const fila=i+2;
      const nombre=col(r,'cliente','nombrecliente','nombre'), contacto=col(r,'nombrecontacto','contacto'), tel=normTel(col(r,'telefono','telefonocontacto','fono','celular'));
      if(!nombre && !contacto && !tel) return;
      if(!nombre){ out.cli.err.push(`Fila ${fila}: falta el nombre del cliente`); return; }
      if(!contacto){ out.cli.err.push(`Fila ${fila} (${nombre}): falta el nombre del contacto`); return; }
      if(tel.length!==11){ out.cli.err.push(`Fila ${fila} (${nombre}): teléfono inválido`); return; }
      const k=nombre.toLowerCase(); if(vistos.has(k)){ out.cli.err.push(`Fila ${fila} (${nombre}): nombre repetido en el archivo`); return; } vistos.add(k);
      const ex=DB.clientes.find(c=>c.nombre.toLowerCase()===k);
      if(!ex) out.cli.nuevos.push({nombre,contacto,telefono:tel});
      else if(ex.contacto!==contacto || ex.tel!==tel || ex.nombre!==nombre) out.cli.act.push({id:ex.id,nombre,contacto,telefono:tel});
      else out.cli.igual++;
    }); }
  [['ori','origenes',['origenes','origen']],['des','destinos',['destinos','destino']]].forEach(([k,lista,hn])=>{
    const rows=hojaDe(wb,...hn); if(!rows) return; out.hojas++; const vistos=new Set();
    rows.forEach(r=>{ const nombre=col(r,'nombre','origen','destino','lugar'); if(!nombre) return;
      const kk=nombre.toLowerCase(); if(vistos.has(kk)) return; vistos.add(kk);
      if(DB[lista].some(x=>x.nombre.toLowerCase()===kk)) out[k].existe++; else out[k].nuevos.push({nombre}); });
  });
  return out;
}
function resumenImport(r){
  if(!r.hojas) return '<div class="banner bad" style="margin-top:12px">El archivo no tiene hojas llamadas Clientes, Origenes o Destinos. Usa la plantilla.</div>';
  const err=[...r.cli.err];
  return `<table class="imptab" style="margin-top:14px"><tr><th></th><th style="text-align:right">Nuevos</th><th style="text-align:right">Se actualizan</th><th style="text-align:right">Sin cambios</th></tr>
    <tr><td>Clientes</td><td class="n">${r.cli.nuevos.length}</td><td class="n">${r.cli.act.length}</td><td class="n">${r.cli.igual}</td></tr>
    <tr><td>Orígenes</td><td class="n">${r.ori.nuevos.length}</td><td class="n">—</td><td class="n">${r.ori.existe}</td></tr>
    <tr><td>Destinos</td><td class="n">${r.des.nuevos.length}</td><td class="n">—</td><td class="n">${r.des.existe}</td></tr></table>
    ${err.length?`<div class="banner warn">${err.length} fila(s) no se cargarán:<br>${err.slice(0,8).map(esc).join('<br>')}${err.length>8?`<br>…y ${err.length-8} más`:''}</div>`:''}`;
}
async function ejecutarImport(){
  if(!IMP || me().rol!=='JT') return;
  const r=IMP;
  try{
    await accion(async()=>{
      const ins=async(t,rows)=>{ if(!rows.length) return; const {error}=await SB.from(t).insert(rows); if(error) throw error; };
      await ins('clientes', r.cli.nuevos);
      for(const c of r.cli.act){ const {error}=await SB.from('clientes').update({nombre:c.nombre,contacto:c.contacto,telefono:c.telefono}).eq('id',+c.id); if(error) throw error; }
      await ins('origenes', r.ori.nuevos);
      await ins('destinos', r.des.nuevos);
    });
  }catch(e){ $('#impres').insertAdjacentHTML('beforeend',`<div class="banner bad">${esc(errMsg(e))}</div>`); return; }
  closeModal(); render();
  const p=[]; if(r.cli.nuevos.length) p.push(`${r.cli.nuevos.length} cliente(s) nuevo(s)`); if(r.cli.act.length) p.push(`${r.cli.act.length} cliente(s) actualizado(s)`);
  if(r.ori.nuevos.length) p.push(`${r.ori.nuevos.length} origen(es)`); if(r.des.nuevos.length) p.push(`${r.des.nuevos.length} destino(s)`);
  toast(`Carga lista: ${p.join(', ')}.`);
}

/* ---------- etapa (stepper) ---------- */
const esNR = e => e && e.estado==='OK' && e.datos && e.datos.resultado==='NR';
function stepHTML(s, e){
  const nr=esNR(e);
  const d=def(e.n), u=me(), cls={OK:'ok',PEN:'pen',NI:'ni',CAN:'can',NA:'ni'}[e.estado]+(d.nb&&e.estado==='PEN'?' nb':'')+(nr?' nr':'');
  const open = OPEN_STEP===e.n || (OPEN_STEP===null && e===pendiente(s));
  let sub='';
  if(e.estado==='OK') sub=`${nr?'No realizada · ':''}${esc(nomU(e.usuario))} · ${fTs(e.fecha)}`;
  else if(e.estado==='PEN') sub=`${d.nb?'Pendiente diferible':'Pendiente'} · ${rolesTxt(d.resp)} · hace ${edad(e.desde||s.creado)}`;
  else if(e.estado==='CAN') sub='Cancelada';
  else sub=`${rolesTxt(d.resp)}${s.estado==='OPORTUNIDAD'&&e.n>3?' · disponible al confirmar':''}`;
  const dot = nr ? ic('xs','stroke-width="3"') : e.estado==='OK' ? ic('check','stroke-width="3"') : e.estado==='CAN' ? ic('x','stroke-width="2.5"') : e.n;
  return `<li class="step ${cls}" id="st${e.n}"><div class="dot">${dot}</div><div class="sbody">
    <button class="shd2" onclick="toggleStep(${e.n})" aria-expanded="${open}"><span class="nm">${esc(d.nom)}${e.n===17?' (1ª)':e.n===19?' (2ª)':''}<small>${sub}</small></span>${d.frec==='A'?'<span class="tag">A veces</span>':''}${d.nb?'<span class="tag" style="color:#4DA3FF">Diferible</span>':''}</button>
    ${open?`<div class="panel">${panelHTML(s,e)}</div>`:''}</div></li>`;
}
function toggleStep(n){ const s=getS(location.hash.split('/')[2]); const e=s.etapas[n-1]; const isOpen = OPEN_STEP===n || (OPEN_STEP===null && e===pendiente(s)); OPEN_STEP = isOpen ? -1 : n; render(); }

function panelHTML(s, e){
  const u=me(), d=def(e.n);
  if(e.estado==='OK') return detalleOK(s,e);
  if(e.estado==='CAN') return `<p class="mut" style="margin:0">${esc(e.obs||'Etapa cancelada.')}</p>`;
  if(!puede(u,s,e)){
    if(s.estado==='OPORTUNIDAD' && e.n>3) return `<p class="mut" style="margin:0">Esta etapa se habilita cuando el servicio sea confirmado (etapa 3).</p>`;
    if(e.estado==='PEN') return `<p class="mut" style="margin:0">Corresponde a <b style="color:#FFFFFF">${rolesTxt(d.resp)}</b>. Solo el responsable o el Jefe de Transporte pueden completarla.</p>`;
    return `<p class="mut" style="margin:0">Se habilitará cuando se completen las etapas anteriores. Responsable: ${rolesTxt(d.resp)}.</p>`;
  }
  const aviso = e.estado!=='PEN' ? `<div class="banner warn" style="margin:0 0 12px">Estás adelantando esta etapa con la facultad de Jefe de Transporte. Quedará registrado en el historial.</div>` : '';
  const nbB = d.nb ? `<div class="banner info" style="margin:0 0 12px">Esta etapa puede completarse después. No impide avanzar con las etapas siguientes.</div>` : '';
  const quien = `<div class="who2"><span class="av ${u.rol}" style="width:26px;height:26px;font-size:12px;border-radius:8px">${ic(ROLE_IC[u.rol])}</span>Completará: ${esc(u.nombre)} (${ROLES[u.rol]})</div>`;
  return aviso + nbB + quien + formHTML(s,e);
}
function detalleOK(s,e){
  const d=e.datos||{}, rows=[];
  rows.push([d.resultado==='NR'?'Registrada por':'Completada por',`${nomU(e.usuario)} (${ROLES[byId('usuarios',e.usuario).rol]})`]); rows.push(['Fecha y hora',fTs(e.fecha)]);
  if(d.resultado==='NR') rows.push(['Resultado','No realizada']);
  if(d.decision) rows.push(['Decisión',d.decision]);
  if(d.registro) rows.push(['N° registro (Folio)',d.registro]);
  if(e.n===5){ const t=byId('tractos',d.tracto), sm=byId('semis',d.semi); rows.push(['Conductor',byId('conductores',d.conductor).nombre]); rows.push(['Tractocamión',`${t.patente} – ${t.marca}`]); rows.push(['Semirremolque',`${sm.patente} – ${sm.tipo}`]); }
  if(d.c12){ rows.push(['Conductor',d.c12.nombre]); rows.push(['RUT',d.c12.rut]); rows.push(['Teléfono',fTel(d.c12.tel)]); rows.push(['Patente tracto',d.c12.tracto]); rows.push(['Patente semirremolque',d.c12.semi]); }
  if(d.lugar) rows.push(['Lugar',d.lugar]);
  if(d.nombre) rows.push(['Contacto',d.nombre]);
  if(d.tel) rows.push(['Teléfono',fTel(d.tel)]);
  if(d.claves) rows.push(['Claves',d.claves]);
  if(d.detalle) rows.push(['Detalle',d.detalle]);
  if(d.estadoEquipo) rows.push(['Estado del equipo',d.estadoEquipo]);
  if(d.km!=null && d.km!=='') rows.push(['Kilometraje',Number(d.km).toLocaleString('es-CL')+' km']);
  if(d.guia) rows.push(['N° guía',d.guia]);
  if(e.obs) rows.push(['Observaciones',e.obs]);
  const ck = d.checklist ? `<div style="margin-top:10px">${CHECKLIST.map((c,i)=>`<div class="ckrow"><span class="lbl"><span class="ckmark ${d.checklist[i]}">${ic(d.checklist[i]==='B'?'check':'xs','stroke-width="3"')}</span>${c}</span><span style="color:${d.checklist[i]==='B'?'#2BD576':'#FF5A5F'};font-weight:600">${d.checklist[i]==='B'?'Bueno':'Malo'}</span></div>`).join('')}</div>` : '';
  return `<dl class="dl">${rows.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>${ck}${d.mensaje?`<div class="mut" style="font-size:13.5px;margin-top:10px">Mensaje enviado por WhatsApp:</div><div class="msg">${esc(d.mensaje)}</div>`:''}`;
}

/* formularios por etapa */
const obsHTML = n => `<div class="fg"><label class="f" for="obs${n}">Observaciones (opcional)</label><textarea class="in" id="obs${n}" style="min-height:64px"></textarea></div>`;
const btnComp = (sid,n,txt='Completar etapa') => `<button class="btn ok block" onclick="submitEtapa('${sid}',${n})">${ic('check')}${txt}</button>`;
function inp(n,k,label,val='',type='text',extra=''){ return `<div class="fg"><label class="f" for="i${n}_${k}">${label}</label><input class="in" id="i${n}_${k}" data-k="${k}" type="${type}" value="${esc(val)}" ${extra}></div>`; }
function waHTML(s,n,v){

function formHTML(s,e){
  const n=e.n, d=def(n), sid=s.id;
  const box = inner => `<div id="f${n}">${inner}</div>`;
  switch(d.tipo){
    case 'cotizacion': return box(btnComp(sid,n,'Marcar cotización enviada'));
    case 'simple': return box(btnComp(sid,n));
    case 'hecho': return box(`${obsHTML(n)}<div class="btnrow"><button class="btn bad" onclick="submitEtapa('${sid}',${n},true)">${ic('x')}No realizada</button><button class="btn ok" onclick="submitEtapa('${sid}',${n})">${ic('check')}Marcar como cumplida</button></div>`);
    case 'decision': return box(`<p class="mut" style="margin:0 0 12px">Registra la respuesta del cliente a la cotización. Confirmar o cancelar notifica a todos los usuarios.</p>
      <div class="fg"><label class="f" for="mot3">Motivo (obligatorio si se cancela)</label><textarea class="in" id="mot3" style="min-height:64px" placeholder="Ej: tarifa no aceptada"></textarea></div>
      <div class="btnrow"><button class="btn bad fill" onclick="decidirUI('${sid}',false)">${ic('x')}Cancelar servicio</button><button class="btn ok" onclick="decidirUI('${sid}',true)">${ic('check')}Confirmar servicio</button></div>`);
    case 'registro': return box(`<div class="banner info" style="margin:0 0 12px">${ic('info','width="18" height="18" style="vertical-align:-4px;margin-right:6px"')}El N° de registro corresponde al <b>N° de Folio</b> que asigna la planilla de registro de viajes.</div>
      ${inp(n,'registro','N° de registro (N° de Folio de la planilla)','','text','placeholder="Ej: ABCD-1234" maxlength="9" autocapitalize="characters" autocomplete="off" spellcheck="false" oninput="fmtRegistro(this)"')}<p class="mut" style="margin:-6px 0 12px;font-size:13.5px">Formato: 4 letras y 4 números (ABCD-1234). El guion se agrega solo.</p>${obsHTML(n)}${btnComp(sid,n)}`);
    case 'asignar': {
      const ocupado = (campo,id) => DB.servicios.find(o=>o.id!==sid && o.estado==='ABIERTO' && o.asign && o.asign[campo]===id);
      const sel=(k,list,lab,fmt,campo)=>`<div class="fg"><label class="f" for="i${n}_${k}">${lab}</label><select class="in" id="i${n}_${k}" data-k="${k}"><option value="">Selecciona</option>${DB[list].map(x=>{const oc=ocupado(campo,x.id);return `<option value="${x.id}">${esc(fmt(x))}${oc?` – en ${oc.id}`:''}</option>`}).join('')}</select></div>`;
      return box(`${sel('conductor','conductores','Conductor',x=>`${x.nombre} · RUT ${x.rut}`,'conductor')}${sel('tracto','tractos','Tractocamión',x=>`${x.patente} – ${x.marca}`,'tracto')}${sel('semi','semis','Semirremolque',x=>`${x.patente} – ${x.tipo} ${x.marca}`,'semi')}${obsHTML(n)}${btnComp(sid,n,'Asignar y completar')}`);
    }
    case 'wa': {
      const v=valoresIniciales(s,n); let campos='';
      const re=`oninput="regen('${sid}',${n})"`;
      if(n===10||n===11) campos=inp(n,'lugar','Lugar',v.lugar,'text',re)+`<div class="grid2">${inp(n,'nombre','Nombre del contacto','','text',re)}${inp(n,'tel','Teléfono del contacto','','tel',re+' inputmode="tel" placeholder="+56 9 1234 5678"')}</div>`;
      if(n===12 && s.asign){ const x=ctx(s); campos=`<dl class="dl" style="margin-bottom:12px"><dt>Conductor</dt><dd>${esc(x.c.nombre)}</dd><dt>RUT</dt><dd>${esc(x.c.rut)}</dd><dt>Teléfono</dt><dd>${fTel(x.c.tel)}</dd><dt>Patente tracto</dt><dd>${esc(x.t.patente)}</dd><dt>Patente semirremolque</dt><dd>${esc(x.sm.patente)}</dd></dl>`; }
      if(n===13) campos=`<div class="fg"><label class="f" for="i13_claves">Claves de pases</label><textarea class="in" id="i13_claves" data-k="claves" style="min-height:64px" ${re} placeholder="Ej: Pase faena N° 48213 – clave 7731"></textarea></div>`;
      return box(`${campos}${waHTML(s,n,v)}${obsHTML(n)}${btnComp(sid,n)}`);
    }
    case 'detalle': return box(`<div class="fg"><label class="f" for="i${n}_detalle">${d.campo}</label><textarea class="in" id="i${n}_detalle" data-k="detalle" style="min-height:70px"></textarea></div>${obsHTML(n)}${btnComp(sid,n)}`);
    case 'equipo': return box(`<div class="fg"><label class="f" for="i${n}_estadoEquipo">Estado del equipo operativo</label><select class="in" id="i${n}_estadoEquipo" data-k="estadoEquipo"><option value="">Selecciona</option>${ESTADO_EQUIPO.map(o=>`<option>${o}</option>`).join('')}</select></div>${obsHTML(n)}${btnComp(sid,n)}`);
    case 'checklist': return box(`<div class="fg">${CHECKLIST.map((c,i)=>`<div class="ckrow" data-ckr="${i}"><span class="lbl"><span class="ckmark" id="ckm${i}"></span>${c}</span><span class="bm"><button type="button" onclick="setCk(${i},'B')">Bueno</button><button type="button" onclick="setCk(${i},'M')">Malo</button></span></div>`).join('')}</div>
      <p class="mut" style="font-size:13.5px;margin:0 0 12px">Si algún ítem está Malo, detalla en observaciones.</p>${obsHTML(n)}${btnComp(sid,n)}`);
    case 'km': {
      const prev = n===18?kmDe(s,16):n===20?(kmDe(s,18)??kmDe(s,16)):null;
      return box(`${inp(n,'km','Kilometraje del odómetro','','number','inputmode="numeric"')}${prev!=null?`<p class="mut" style="margin:-6px 0 12px;font-size:14px">Último registro: ${prev.toLocaleString('es-CL')} km</p>`:''}${obsHTML(n)}${btnComp(sid,n)}`);
    }
    case 'guia': return box(`${inp(n,'guia','N° de guía de despacho','')}${obsHTML(n)}${btnComp(sid,n)}`);
    case 'fin': {
      const k0=kmDe(s,16), k1=kmDe(s,20), inc=s.etapas.filter(x=>x.aplica&&x.n<21&&x.estado!=='OK').length;
      return box(`<dl class="dl" style="margin-bottom:12px">${k0!=null&&k1!=null?`<dt>Km recorridos</dt><dd>${(k1-k0).toLocaleString('es-CL')} km</dd>`:''}<dt>Etapas completas</dt><dd>${progreso(s).ok} de ${progreso(s).total}</dd></dl>
        ${inc?`<div class="banner warn" style="margin:0 0 12px">Hay ${inc} etapa(s) sin completar. Al cerrar quedarán canceladas sin ejecutar.</div>`:''}
        ${obsHTML(n)}<button class="btn ok block" onclick="submitEtapa('${sid}',21)">${ic('done')}Cerrar servicio</button>`);
    }
  }
  return box(obsHTML(n)+btnComp(sid,n));
}
/* N° de registro de planilla viajes: 4 letras + guion + 4 números (ABCD-1234) */
const REG_RE=/^[A-Z]{4}-[0-9]{4}$/;
function fmtRegistro(el){
  const raw=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const letras=raw.slice(0,4).replace(/[^A-Z]/g,'');
  const nums = letras.length<4 ? '' : raw.slice(4).replace(/[^0-9]/g,'').slice(0,4);
  el.value = letras + (letras.length===4 && (nums || raw.length>4) ? '-' + nums : '');
}
const ESTADO_EQUIPO=['Equipo Operativo','Equipo con Observaciones','Equipo No Operativo'];
function setCk(i,v){
  const r=document.querySelector(`[data-ckr="${i}"]`); r.dataset.v=v;
  const m=$('#ckm'+i); m.className='ckmark '+v; m.innerHTML=ic(v==='B'?'check':'xs','stroke-width="3"');
  const b=r.querySelectorAll('.bm button'); b[0].className=v==='B'?'onB':''; b[1].className=v==='M'?'onM':'';
}
function vals(n){
  const o={}; const f=$('#f'+n); if(!f) return o;
  f.querySelectorAll('[data-k]').forEach(el=>{ o[el.dataset.k]=el.value.trim(); });
  const ck=f.querySelectorAll('[data-ckr]'); if(ck.length) o.checklist=[...ck].map(r=>r.dataset.v||'');
  return o;
}
function regen(sid,n){ const s=getS(sid), ta=$('#wa'+n); if(ta && !ta.dataset.edit) ta.value=mensaje(s,n,vals(n)); }
function enviarWA(sid,n){
  const s=getS(sid), v=vals(n), dst=waDestino(s,n,v), txt=$('#wa'+n).value;
  const tel=cleanTel(dst.tel); if(!tel){ toast('No hay número de destino registrado.','bad'); return; }
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`,'_blank','noopener');
  WA_SENT[sid+'_'+n]=Date.now(); const el=$('#sent'+n); if(el) el.textContent=`Abierto en WhatsApp a las ${fHora(Date.now())}`;
}
function decidirUI(sid, conf){
  const s=getS(sid), mot=$('#mot3').value.trim();
  if(!conf && !mot){ toast('Indica el motivo de la cancelación.','bad'); $('#mot3').focus(); return; }
  const fuera = s.etapas[1].estado!=='OK';
  const run=async()=>{
    try{ await accion(()=>rpc('decidir_servicio',{p_servicio:sid, p_confirma:conf, p_motivo:mot})); }
    catch(e){ toast(errMsg(e),'bad'); return; }
    OPEN_STEP=null; FOCUS_PEN=true; render(); toast(conf?`Servicio ${sid} confirmado. Se notificó a todos los usuarios.`:`Servicio ${sid} cancelado. Se notificó a todos los usuarios.`, conf?'ok':'bad'); };
  confirmar(conf?'Confirmar servicio':'Cancelar servicio',
    (conf?`El servicio ${sid} pasará a <b style="color:#FFFFFF">Servicios abiertos</b> y se habilitarán las etapas operacionales.`:`El servicio ${sid} pasará a <b style="color:#FFFFFF">Servicios declinados</b>. Motivo: ${esc(mot)}`)+(fuera?'<br><br>La cotización (etapa 2) aún no se marca como enviada.':''),
    conf?'Confirmar':'Cancelar servicio', run, conf?'ok':'bad fill');
}
function cancelarModal(sid){
  modal(`<div class="shd"><div><h2>Cancelar servicio ${sid}</h2><p class="mut" style="margin:0">Las etapas pendientes quedarán canceladas y se notificará a todos.</p></div></div>
    <div class="fg"><label class="f" for="cmot">Motivo</label><textarea class="in" id="cmot"></textarea></div><div id="cerr"></div>
    <div class="acts"><button class="btn" onclick="closeModal()">Volver</button><button class="btn bad fill" onclick="cancelarUI('${sid}')">Cancelar servicio</button></div>`);
}
async function cancelarUI(sid){
  const m=$('#cmot').value.trim(); if(!m){ $('#cerr').innerHTML='<div class="err">Indica el motivo.</div>'; return; }
  try{ await accion(()=>rpc('cancelar_servicio',{p_servicio:sid, p_motivo:m})); }
  catch(e){ $('#cerr').innerHTML=`<div class="err">${esc(errMsg(e))}</div>`; return; }
  closeModal(); render(); toast(`Servicio ${sid} cancelado. Se notificó a todos los usuarios.`,'bad');
}
function submitEtapa(sid, n, noRealizada){
  const s=getS(sid), e=s.etapas[n-1], d=def(n), v=vals(n), obs=($('#obs'+n)?.value||'').trim(), u=me();
  if(!puede(u,s,e)){ toast('No tienes permiso para completar esta etapa.','bad'); return; }
  let datos={}, err='';
  switch(d.tipo){
    case 'registro': if(!REG_RE.test(v.registro||'')) err='El N° de registro debe tener 4 letras y 4 números, por ejemplo ABCD-1234.'; datos={registro:v.registro}; break;
    case 'asignar': if(!v.conductor||!v.tracto||!v.semi) err='Selecciona conductor, tractocamión y semirremolque.'; datos={conductor:v.conductor,tracto:v.tracto,semi:v.semi}; break;
    case 'detalle': if(!v.detalle && !obs) err='Agrega el detalle de la gestión.'; datos={detalle:v.detalle}; break;
    case 'equipo': if(!v.estadoEquipo) err='Selecciona el estado del equipo.'; else if(v.estadoEquipo!=='Equipo Operativo' && !obs) err='Detalla en observaciones el estado del equipo.'; datos={estadoEquipo:v.estadoEquipo}; break;
    case 'checklist': if(v.checklist.some(x=>!x)) err='Marca Bueno o Malo en todos los ítems del checklist.'; else if(v.checklist.includes('M') && !obs) err='Hay ítems en Malo: detalla en observaciones.'; datos={checklist:v.checklist}; break;
    case 'km': {
      if(v.km===''||isNaN(Number(v.km))||Number(v.km)<0) { err='Ingresa un kilometraje válido.'; break; }
      const prev = n===18?kmDe(s,16):n===20?(kmDe(s,18)??kmDe(s,16)):null;
      if(prev!=null && Number(v.km)<prev) err=`El kilometraje no puede ser menor al anterior (${prev.toLocaleString('es-CL')} km).`;
      datos={km:Number(v.km)}; break;
    }
    case 'guia': if(!v.guia) err='Ingresa el N° de guía.'; datos={guia:v.guia}; break;
    case 'wa':
      if(n===10||n===11){ if(!v.nombre||normTel(v.tel).length<8) err='Ingresa nombre y teléfono del contacto.'; datos={lugar:v.lugar,nombre:v.nombre,tel:normTel(v.tel)}; }
      else if(n===12){ if(!s.asign) err='Primero asigna conductor, tracto y semirremolque (etapa 5).'; else { const x=ctx(s); datos={c12:{nombre:x.c.nombre,rut:x.c.rut,tel:x.c.tel,tracto:x.t.patente,semi:x.sm.patente}}; } }
      else datos={...v};
      break;
  }
  if(noRealizada) datos={resultado:'NR'};
  if(err){ toast(err,'bad'); return; }
  const key=sid+'_'+n, ta=$('#wa'+n);
  if(ta){ datos.mensaje=ta.value; if(WA_SENT[key]) datos.waEnviado=WA_SENT[key]; }
  const warns=[];
  if(e.estado!=='PEN') warns.push('Estás completando esta etapa fuera de secuencia (facultad de Jefe de Transporte).');
  if(ta && !WA_SENT[key]) warns.push('Aún no has abierto WhatsApp para enviar el mensaje.');
  if(n===21){ const inc=s.etapas.filter(x=>x.aplica&&x.n<21&&x.estado!=='OK').length; if(inc) warns.push(`${inc} etapa(s) quedarán canceladas sin ejecutar.`); }
  const run=async()=>{
    const prevPen=new Set(pendientes(s).map(x=>x.n));
    try{ await accion(()=>rpc('completar_etapa',{p_servicio:sid, p_n:n, p_datos:datos, p_obs:obs, p_detalle:resumenDatos(s,n,datos,obs)})); }
    catch(e){ toast(errMsg(e),'bad'); return; }
    OPEN_STEP=null; FOCUS_PEN=true;
    const s2=getS(sid), nuevas=s2?pendientes(s2).filter(x=>!prevPen.has(x.n)):[];
    render();
    if(n===21) toast(`Servicio ${sid} cerrado. Se notificó a todos los usuarios.`);
    else toast(`Etapa ${n} ${noRealizada?'marcada como no realizada':'completada'}.${nuevas.length?` Se notificó a ${[...new Set(nuevas.flatMap(x=>def(x.n).resp))].map(r=>ROLES[r]).join(', ')}.`:''}`);
  };
  if(warns.length) confirmar(n===21?'Cerrar servicio':noRealizada?'Marcar como no realizada':'Completar etapa', warns.join('<br><br>'), n===21?'Cerrar servicio':'Completar igual', run, 'ok');
  else run();
}

/* ---------- AVISOS: sonido + mensaje emergente ---------- */
let ACTX=null;
function audioInit(){ try{ if(!ACTX){ const C=window.AudioContext||window.webkitAudioContext; if(C) ACTX=new C(); } if(ACTX && ACTX.state==='suspended') ACTX.resume(); }catch(e){} }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,audioInit,{passive:true}));
const sonidoOn = () => { try{ return localStorage.getItem('gs_sonido_'+SES)!=='0'; }catch(e){ return true; } };
function toggleSonido(){ const on=sonidoOn(); try{ localStorage.setItem('gs_sonido_'+SES, on?'0':'1'); }catch(e){} closeModal(); toast(on?'Sonido de notificaciones desactivado.':'Sonido de notificaciones activado.','info'); if(!on) sonar(); }
function sonar(){
  if(!sonidoOn()) return;
  try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){}
  try{
    audioInit(); if(!ACTX) return;
    const t=ACTX.currentTime;
    [[880,0],[1318.5,0.15]].forEach(([f,d])=>{
      const o=ACTX.createOscillator(), g=ACTX.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.28,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.5);
      o.connect(g); g.connect(ACTX.destination); o.start(t+d); o.stop(t+d+0.55);
    });
  }catch(e){}
}
function popAviso(o){
  const box=$('#avisos'); if(!box) return;
  while(box.children.length>=3) box.firstChild.remove();
  const el=document.createElement('div'); el.className='aviso '+(o.kind||''); el.setAttribute('role','alert');
  el.innerHTML=`<span class="ai">${ic('bell')}</span><div><b>${esc(o.titulo)}</b><p>${esc(o.msg)}</p><div class="ab"><button>${o.nid?'Ver servicio':'Ver notificaciones'}</button></div></div><button class="x" aria-label="Cerrar">${ic('xs')}</button>`;
  el.querySelector('.ab button').onclick=()=>{ el.remove(); if(o.nid) abrirNotif(o.nid); else location.hash='#/notificaciones'; };
  el.querySelector('.x').onclick=()=>el.remove();
  box.appendChild(el); setTimeout(()=>el.remove(), 9000);
}
/* Detecta notificaciones nuevas para el usuario actual: suena y muestra el mensaje emergente */
function checkNuevas(){
  const u=me(); if(!u) return;
  const k='gs_alerta_'+u.id; let last=0; try{ last=Number(localStorage.getItem(k))||0; }catch(e){}
  const nuevas=misNotifs(u).filter(n=>!n.leidos.includes(u.id) && n.fecha>last);
  if(!nuevas.length) return;
  try{ localStorage.setItem(k, String(Math.max(...nuevas.map(n=>n.fecha)))); }catch(e){}
  sonar();
  if(nuevas.length>2) popAviso({titulo:`${nuevas.length} notificaciones nuevas`, msg:nuevas[0].msg, kind:'info'});
  else nuevas.slice().reverse().forEach(n=>popAviso({titulo:NTIPO[n.tipo][0], msg:n.msg, nid:n.id, kind:NTIPO[n.tipo][1]}));
}
/* ¿Se puede repintar sin borrar lo que el usuario está escribiendo? */
function puedeRepintar(){
  if($('#modal').innerHTML) return false;
  const a=document.activeElement; if(a && a.matches && a.matches('input,textarea,select')) return false;
  const v=$('#view'); if(!v) return true;
  if([...v.querySelectorAll('input:not([type=checkbox]),textarea')].some(x=>x.value!==x.defaultValue)) return false;
  if([...v.querySelectorAll('select')].some(x=>x.selectedIndex>0)) return false;
  if(v.querySelector('[data-ckr][data-v]')) return false;
  return true;
}
/* ---------- ROUTER ---------- */
function render(){
  if(!SES || !me()) return renderLogin();
  const parts=location.hash.replace(/^#\/?/,'').split('/'); const r=parts[0]||'inicio';
  let t='Inicio', body='';
  switch(r){
    case 'oportunidades': case 'abiertos': case 'declinados': case 'cerrados': t=NAV.find(n=>n.k===r).t; body=vLista(r); break;
    case 'alertas': t='Alertas pendientes'; body=vAlertas(); break;
    case 'notificaciones': t='Notificaciones'; body=vNotifs(); break;
    case 'clientes': t='Clientes'; body=vClientes(); break;
    case 'servicio': t='Detalle del servicio'; body=vServicio(parts[1]); break;
    default: t='Gestión de Servicios'; body=vInicio();
  }
  $('#app').innerHTML=shell(r,t,body);
  if(r==='servicio' && FOCUS_PEN){
    const tgt = typeof FOCUS_PEN==='number' ? FOCUS_PEN : null; FOCUS_PEN=false;
    const s=getS(parts[1]), p=s&&pendiente(s), nn = tgt || (p&&p.n);
    const el=nn && document.getElementById('st'+nn);
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),60);
    else window.scrollTo(0,0);
  }
}
/* ---------- INIT ---------- */
let LASTROUTE='';
window.addEventListener('hashchange',()=>{
  const r=location.hash; const base=r.split('/').slice(0,3).join('/');
  if(base!==LASTROUTE){ if(!FOCUS_PEN){ OPEN_STEP=null; DTAB='wf'; } window.scrollTo(0,0); }
  LASTROUTE=base; render();
});
async function init(){
  if(!window.supabase || !window.supabase.createClient){
    $('#app').innerHTML=`<div class="login"><div class="lcard">${logo()}<div class="lerr">No se pudo cargar la conexión. Revisa tu internet y recarga la página.</div><button class="btn pri block" onclick="location.reload()">Recargar</button></div></div>`;
    return;
  }
  SB = window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
  renderCargando();
  let sesion=null;
  try{ const {data}=await SB.auth.getSession(); sesion=data.session; }catch(e){}
  if(sesion) await iniciarSesion(sesion.user.id, false);
  else render();
  SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT' && SES){ SES=null; DB=vacio(); desconectarTiempoReal(); render(); } });
}
init();
setInterval(()=>{ if(SES && puedeRepintar()) render(); }, 60000);
</script>
